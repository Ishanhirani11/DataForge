version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dataforge_postgres
    environment:
      POSTGRES_DB: dataforge
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dataforge_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataforge_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dataforge_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataforge_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge_app
    environment:
      DATABASE_URL: postgresql://dataforge:${DB_PASSWORD:-dataforge_pass}@postgres:5432/dataforge
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - dataforge_network
    restart: unless-stopped

networks:
  dataforge_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
