pipeline:
  name: ai_job_replacement_pipeline

source:
  type: file
  path: "data/AI Job Replacement Dataset.csv"
  format: csv

transform:
  clean:
    missing_value_strategy: fill_default
    missing_value_default: 0
    remove_duplicates: true
    numeric_columns:
      - automation_risk_percent
      - ai_replacement_score
      - skill_gap_index
      - salary_before_usd
      - salary_after_usd
      - salary_change_percent
      - skill_demand_growth_percent
      - remote_feasibility_score
      - ai_adoption_level
      - wage_volatility_index
      - reskilling_urgency_score
      - ai_disruption_intensity

  validate:
    required:
      - job_id
      - job_role
      - industry
      - country
      - salary_before_usd
    ranges:
      automation_risk_percent:
        min: 0
        max: 100
      ai_replacement_score:
        min: 0
        max: 100
      salary_before_usd:
        min: 0
        max: 1000000
      salary_after_usd:
        min: 0
        max: 1000000

  enrich:
    label_encode:
      - automation_risk_category
      - industry
      - country

target:
  type: file
  path: data/output/clean_ai_replacement.json
  format: json
