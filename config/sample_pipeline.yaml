pipeline:
  name: sample_pipeline

source:
  type: file
  path: data/cars.csv
  format: csv

transform:
  clean:
    missing_value_strategy: fill_default
    missing_value_default: unknown
    remove_duplicates: true
    numeric_columns:
      - year
      - mileage
      - price

  validate:
    required:
      - manufacturer
      - model
      - year
      - price
    ranges:
      year:
        min: 1980
        max: 2026
      price:
        min: 500
        max: 300000

target:
  type: file
  path: data/output/clean_sample.csv
  format: csv
