pipeline:
  name: sample_users_pipeline

source:
  type: file
  path: data/AI_Job_Market_Dataset.csv.csv
  format: csv

transform:
  clean:
    missing_value_strategy: fill_default
    missing_value_default: unknown
    remove_duplicates: true
    numeric_columns:
      - age

  validate:
    required:
      - id
      - name
      - email
    patterns:
      email: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ranges:
      age:
        min: 18
        max: 120

  enrich:
    label_encode:
      - country

target:
  type: file
  path: data/output/clean_users.json
  format: json
