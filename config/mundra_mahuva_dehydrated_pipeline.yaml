pipeline:
  name: mundra_mahuva_dehydrated_pipeline

source:
  type: file
  path: data/mundra_nov 2025.xlsx
  format: excel
  sheet_name: Sheet1

transform:
  clean:
    missing_value_strategy: fill_default
    missing_value_default: unknown
    remove_duplicates: true
    numeric_columns:
      - QUANTITY
      - UNIT RATE
      - FOB INV VALUE
      - FOB IN USD

  # OR filter: keep rows matching ANY of these conditions
  filter:
    or:
      - column: EXPORTER CITY
        operator: contains
        value: mahuva
      - column: DESCRIPTION
        operator: contains
        value: dehydrated onion
      - column: DESCRIPTION
        operator: contains
        value: dehydrated garlic

target:
  type: file
  path: data/output/mundra_mahuva_dehydrated_nov2025.csv
  format: csv
