# Prometheus configuration for DataFlow Pro

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dataflow_pro'
    static_configs:
      - targets: ['worker:8080']
        labels:
          service: 'dataflow_pro'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow_webserver:8080']