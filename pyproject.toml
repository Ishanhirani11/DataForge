[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-pro"
version = "0.1.0"
description = "Professional Data Engineering Framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DataFlow Pro Team", email = "dataflow-pro@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
keywords = ["etl", "data-engineering", "pipeline", "data-quality"]
dependencies = [
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.6.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
]
all = [
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "boto3>=1.33.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "great-expectations>=0.17.0",
    "apache-airflow>=2.8.0",
    "prometheus-client>=0.19.0",
]

[project.scripts]
dataflow-pro = "dataflow_pro.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["dataflow_pro"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[project.urls]
Homepage = "https://github.com/dataflow-pro/dataflow-pro"
Repository = "https://github.com/dataflow-pro/dataflow-pro"